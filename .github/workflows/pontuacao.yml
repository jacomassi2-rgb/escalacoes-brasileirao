name: Parciais em Tempo Real

on:
  schedule:
    - cron: '*/10 17-23,0-4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar_parciais:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar coletor de parciais
        run: python parciais.py

      # NÃO salva no repositório, apenas notifica
      # O site é atualizado pelo outro workflow
