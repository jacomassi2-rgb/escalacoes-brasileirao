name: Atualizar Escalações

on:
  schedule:
    - cron: '0 11,16,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir_e_publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install feedparser

      - name: Rodar o coletor
        run: python coletor.py

      - name: Rodar o gerador de site
        run: python gerar_site.py

      - name: Enviar as atualizações para o GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add site/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Atualização automática das escalações"
          git push
