name: Atualizar Escalações

on:
  schedule:
    - cron: '0 11,16,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir_e_publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install feedparser beautifulsoup4 requests

      - name: Rodar o coletor
        run: python coletor.py

      - name: Rodar o gerador de site
        run: python gerar_site.py

      - name: Enviar as atualizações para o GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Atualização automática das escalações"
          git push

      - name: Enviar notificação no Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HORA=$(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M')
          MENSAGEM="🤖 Escalações atualizadas!%0A%0A📅 Rodada 29%0A⏰ ${HORA}%0A%0A🔗 https://jacomassi2-rgb.github.io/escalacoes-brasileirao"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=${MENSAGEM}"
