name: Atualizar Escalações

on:
  schedule:
    - cron: '0 11,16,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir_e_publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install feedparser beautifulsoup4 requests

      - name: Rodar o coletor
        run: python coletor.py

      - name: Rodar o extrator de escalações
        run: python extrator.py

      - name: Rodar o gerador de site
        run: python gerar_site.py

      - name: Enviar as atualizações para o GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Atualização automática das escalações"
          git push

      - name: Enviar notificação no Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          from datetime import datetime
          from zoneinfo import ZoneInfo
          
          hora = datetime.now(ZoneInfo('America/Sao_Paulo')).strftime('%d/%m/%Y %H:%M')
          mensagem = f'''🤖 Escalações atualizadas!

          📅 Rodada 29
          ⏰ {hora}

          🔗 https://jacomassi2-rgb.github.io/escalacoes-brasileirao'''
          
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          
          r = requests.post(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data={'chat_id': chat_id, 'text': mensagem}
          )
          print(r.status_code, r.text)
          "
