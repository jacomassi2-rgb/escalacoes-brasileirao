name: Notícias dos Setoristas

on:
  schedule:
    # Roda 2x ao dia: 9h e 21h (horário de Brasília)
    - cron: '0 12,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar_setoristas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 lxml

      - name: Rodar coletor de setoristas
        run: python setoristas.py

      - name: Salvar no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add noticias_setoristas.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Notícias dos setoristas atualizadas"
          git pull --rebase --autostash origin main || true
          git push || (git pull --rebase --autostash origin main && git push)
