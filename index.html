<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fathur FC — Análise Cartola</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; --accent: #00b894; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        header { background-color: #000; padding: 15px 20px; text-align: center; border-bottom: 2px solid var(--accent); }
        header h1 { margin: 0; font-size: 1.5rem; }
        .tabs { display: flex; background-color: #000; justify-content: center; gap: 10px; padding: 10px; }
        .tab-btn { background: none; border: none; color: #888; padding: 10px 20px; font-size: 1rem; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.3s; }
        .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); font-weight: bold; }
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Filtros */
        .filters { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; background-color: var(--card-bg); padding: 15px; border-radius: 8px; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .filter-group select { background-color: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 4px; }
        
        /* Visual Cruzamento Cartola */
        .match-container { background-color: #000; border-radius: 8px; margin-bottom: 15px; overflow: hidden; display: flex; align-items: center; padding: 15px; gap: 20px;}
        .match-team { flex: 1; text-align: center; }
        .match-team-logo { width: 50px; height: 50px; background-color: #333; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 5px; }
        .match-team-name { font-size: 1rem; font-weight: bold; }
        
        .match-stats { flex: 2; display: flex; flex-direction: column; gap: 10px; }
        .stat-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .stat-bar-left { flex: 1; display: flex; justify-content: flex-end; }
        .stat-bar-right { flex: 1; display: flex; justify-content: flex-start; }
        .bar { height: 30px; border-radius: 15px; display: flex; align-items: center; padding: 0 10px; color: #fff; font-weight: bold; font-size: 0.9rem; min-width: 40px; transition: width 0.5s; }
        .bar-green { background-color: #00b894; justify-content: flex-end; }
        .bar-red { background-color: #ff7675; justify-content: flex-start; }
        .stat-label { text-align: center; font-size: 0.8rem; color: #888; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px;}
    </style>
</head>
<body>
<header>
    <h1>⚽ Fathur FC — Análise e Estratégia</h1>
</header>
<div class="tabs">
    <button class="tab-btn active" onclick="openTab('cruzamento', event)">📊 Cruzamento de Scouts</button>
    <button class="tab-btn" onclick="openTab('classificacao', event)">🏆 Classificação</button>
</div>
<div class="container">
    
    <!-- ABA CRUZAMENTO (NOVA) -->
    <div id="cruzamento" class="tab-content active">
        <h2>Cruzamento de Scouts (Feito x Cedido)</h2>
        <div class="filters">
            <div class="filter-group">
                <label>Posição</label>
                <select id="filtro-posicao" onchange="renderCruzamento()">
                    <option value="ZAG">Zagueiros</option>
                    <option value="LAT">Laterais</option>
                    <option value="MEI">Meias</option>
                    <option value="ATA">Atacantes</option>
                    <option value="GOL">Goleiros</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Scout</label>
                <select id="filtro-scout" onchange="renderCruzamento()">
                    <option value="DS">Desarmes</option>
                    <option value="FF">Finalizações</option>
                    <option value="G">Gols</option>
                    <option value="A">Assistências</option>
                    <option value="SG">Saldo de Gols</option>
                </select>
            </div>
        </div>
        <div id="cruzamento-list"></div>
    </div>

    <!-- ABA CLASSIFICAÇÃO -->
    <div id="classificacao" class="tab-content">
        <div style="background-color: var(--card-bg); padding: 20px; border-radius: 8px; text-align: center;">
            <h2>Campeonato Brasileiro Série A <span style="background-color: red; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; animation: blink 1s infinite;">AO VIVO</span></h2>
            <iframe src="https://ge.globo.com/futebol/brasileirao-serie-a/tabela/" width="100%" height="600" frameborder="0" style="border-radius: 8px; margin-top: 15px;"></iframe>
        </div>
    </div>
</div>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => { for(let r of regs) r.unregister(); });
    }

    const dadosCruzamento = {"casa": {"BAH_ata": {}, "BAH_gol": {}, "BAH_lat": {}, "BAH_mei": {}, "BAH_tec": {}, "BAH_zag": {}, "BOT_ata": {}, "BOT_gol": {}, "BOT_lat": {}, "BOT_mei": {}, "BOT_tec": {}, "BOT_zag": {}, "CAM_ata": {}, "CAM_gol": {}, "CAM_lat": {}, "CAM_mei": {}, "CAM_tec": {}, "CAM_zag": {}, "CAP_ata": {}, "CAP_gol": {}, "CAP_lat": {}, "CAP_mei": {}, "CAP_tec": {}, "CAP_zag": {}, "CFC_ata": {}, "CFC_gol": {}, "CFC_lat": {}, "CFC_mei": {}, "CFC_tec": {}, "CFC_zag": {}, "CHA_ata": {}, "CHA_gol": {}, "CHA_lat": {}, "CHA_mei": {}, "CHA_tec": {}, "CHA_zag": {}, "COR_ata": {}, "COR_gol": {}, "COR_lat": {}, "COR_mei": {}, "COR_tec": {}, "COR_zag": {}, "CRU_ata": {}, "CRU_gol": {}, "CRU_lat": {}, "CRU_mei": {}, "CRU_tec": {}, "CRU_zag": {}, "FLA_ata": {}, "FLA_gol": {}, "FLA_lat": {}, "FLA_mei": {}, "FLA_tec": {}, "FLA_zag": {}, "FLU_ata": {}, "FLU_gol": {}, "FLU_lat": {}, "FLU_mei": {}, "FLU_tec": {}, "FLU_zag": {}, "GRE_ata": {}, "GRE_gol": {}, "GRE_lat": {}, "GRE_mei": {}, "GRE_tec": {}, "GRE_zag": {}, "INT_ata": {}, "INT_gol": {}, "INT_lat": {}, "INT_mei": {}, "INT_tec": {}, "INT_zag": {}, "MIR_ata": {}, "MIR_gol": {}, "MIR_lat": {}, "MIR_mei": {}, "MIR_tec": {}, "MIR_zag": {}, "PAL_ata": {}, "PAL_gol": {}, "PAL_lat": {}, "PAL_mei": {}, "PAL_tec": {}, "PAL_zag": {}, "RBB_ata": {}, "RBB_gol": {}, "RBB_lat": {}, "RBB_mei": {}, "RBB_tec": {}, "RBB_zag": {}, "REM_ata": {}, "REM_gol": {}, "REM_lat": {}, "REM_mei": {}, "REM_tec": {}, "REM_zag": {}, "SAN_ata": {}, "SAN_gol": {}, "SAN_lat": {}, "SAN_mei": {}, "SAN_tec": {}, "SAN_zag": {}, "SAO_ata": {}, "SAO_gol": {}, "SAO_lat": {}, "SAO_mei": {}, "SAO_tec": {}, "SAO_zag": {}, "VAS_ata": {}, "VAS_gol": {}, "VAS_lat": {}, "VAS_mei": {}, "VAS_tec": {}, "VAS_zag": {}, "VIT_ata": {}, "VIT_gol": {}, "VIT_lat": {}, "VIT_mei": {}, "VIT_tec": {}, "VIT_zag": {}}, "fora": {"BAH_ata": {}, "BAH_gol": {}, "BAH_lat": {}, "BAH_mei": {}, "BAH_tec": {}, "BAH_zag": {}, "BOT_ata": {}, "BOT_gol": {}, "BOT_lat": {}, "BOT_mei": {}, "BOT_tec": {}, "BOT_zag": {}, "CAM_ata": {}, "CAM_gol": {}, "CAM_lat": {}, "CAM_mei": {}, "CAM_tec": {}, "CAM_zag": {}, "CAP_ata": {}, "CAP_gol": {}, "CAP_lat": {}, "CAP_mei": {}, "CAP_tec": {}, "CAP_zag": {}, "CFC_ata": {}, "CFC_gol": {}, "CFC_lat": {}, "CFC_mei": {}, "CFC_tec": {}, "CFC_zag": {}, "CHA_ata": {}, "CHA_gol": {}, "CHA_lat": {}, "CHA_mei": {}, "CHA_tec": {}, "CHA_zag": {}, "COR_ata": {}, "COR_gol": {}, "COR_lat": {}, "COR_mei": {}, "COR_tec": {}, "COR_zag": {}, "CRU_ata": {}, "CRU_gol": {}, "CRU_lat": {}, "CRU_mei": {}, "CRU_tec": {}, "CRU_zag": {}, "FLA_ata": {}, "FLA_gol": {}, "FLA_lat": {}, "FLA_mei": {}, "FLA_tec": {}, "FLA_zag": {}, "FLU_ata": {}, "FLU_gol": {}, "FLU_lat": {}, "FLU_mei": {}, "FLU_tec": {}, "FLU_zag": {}, "GRE_ata": {}, "GRE_gol": {}, "GRE_lat": {}, "GRE_mei": {}, "GRE_tec": {}, "GRE_zag": {}, "INT_ata": {}, "INT_gol": {}, "INT_lat": {}, "INT_mei": {}, "INT_tec": {}, "INT_zag": {}, "MIR_ata": {}, "MIR_gol": {}, "MIR_lat": {}, "MIR_mei": {}, "MIR_tec": {}, "MIR_zag": {}, "PAL_ata": {}, "PAL_gol": {}, "PAL_lat": {}, "PAL_mei": {}, "PAL_tec": {}, "PAL_zag": {}, "RBB_ata": {}, "RBB_gol": {}, "RBB_lat": {}, "RBB_mei": {}, "RBB_tec": {}, "RBB_zag": {}, "REM_ata": {}, "REM_gol": {}, "REM_lat": {}, "REM_mei": {}, "REM_tec": {}, "REM_zag": {}, "SAN_ata": {}, "SAN_gol": {}, "SAN_lat": {}, "SAN_mei": {}, "SAN_tec": {}, "SAN_zag": {}, "SAO_ata": {}, "SAO_gol": {}, "SAO_lat": {}, "SAO_mei": {}, "SAO_tec": {}, "SAO_zag": {}, "VAS_ata": {}, "VAS_gol": {}, "VAS_lat": {}, "VAS_mei": {}, "VAS_tec": {}, "VAS_zag": {}, "VIT_ata": {}, "VIT_gol": {}, "VIT_lat": {}, "VIT_mei": {}, "VIT_tec": {}, "VIT_zag": {}}};

    function openTab(tabId, event) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if (event) event.target.classList.add('active');
    }

    function renderCruzamento() {
        try {
            const posicao = document.getElementById('filtro-posicao').value;
            const scout = document.getElementById('filtro-scout').value;
            const container = document.getElementById('cruzamento-list');
            
            if (!dadosCruzamento.casa || !dadosCruzamento.fora) {
                container.innerHTML = '<p style="color: #d63031; text-align: center;">Dados de cruzamento não encontrados.</p>';
                return;
            }

            let jogos = [];
            // Para cada time jogando em casa, acha o adversário que joga fora (na mesma rodada/futuro)
            // Como o JSON é estático, vamos apenas simular os confrontos baseados nos times que têm dados
            
            // Vamos pegar os times que têm dados na posição selecionada
            let timesCasa = Object.keys(dadosCruzamento.casa).filter(k => k.endsWith(`_${posicao}`));
            
            timesCasa.forEach(chaveCasa => {
                const timeCasa = chaveCasa.split('_')[0];
                const dadosTimeCasa = dadosCruzamento.casa[chaveCasa];
                const valorFeito = dadosTimeCasa[scout] || 0;

                // Para o cruzamento real, você precisaria do confronto da rodada (ex: Palmeiras x Bragantino).
                // Aqui vamos apenas cruzar com todos os times que jogam fora como exemplo.
                // No seu script final, você pode mapear o adversário real da rodada.
                
                // Exemplo: Pega o primeiro time fora com dados (só para mostrar a barra dupla)
                let chaveForaExemplo = Object.keys(dadosCruzamento.fora).find(k => k.endsWith(`_${posicao}`));
                if(!chaveForaExemplo) return;
                
                const timeFora = chaveForaExemplo.split('_')[0];
                const dadosTimeFora = dadosCruzamento.fora[chaveForaExemplo];
                const valorCedido = dadosTimeFora[scout] || 0;

                // Calcula a porcentagem para as barras
                const maxValor = Math.max(valorFeito, valorCedido, 1);
                const pctFeito = (valorFeito / maxValor) * 100;
                const pctCedido = (valorCedido / maxValor) * 100;

                jogos.push({
                    timeCasa, timeFora, valorFeito, valorCedido, pctFeito, pctCedido
                });
            });

            // Limita a 8 jogos para não poluir a tela
            let html = '';
            jogos.slice(0, 8).forEach(j => {
                html += `
                <div class="match-container">
                    <div class="match-team">
                        <div class="match-team-logo">${j.timeCasa}</div>
                        <div class="match-team-name">${j.timeCasa}</div>
                    </div>
                    
                    <div class="match-stats">
                        <div class="stat-row">
                            <div class="stat-bar-left" style="width: 45%;">
                                <div class="bar bar-green" style="width: ${j.pctFeito}%;">${j.valorFeito}</div>
                            </div>
                            <div style="width: 10%; text-align: center; color: #888; font-weight: bold;">X</div>
                            <div class="stat-bar-right" style="width: 45%;">
                                <div class="bar bar-red" style="width: ${j.pctCedido}%;">${j.valorCedido}</div>
                            </div>
                        </div>
                        <div class="stat-label">${scout === 'DS' ? 'Desarmes' : scout} Feitos x Cedidos</div>
                    </div>
                    
                    <div class="match-team">
                        <div class="match-team-logo">${j.timeFora}</div>
                        <div class="match-team-name">${j.timeFora}</div>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html || '<p style="text-align: center; color: #888;">Nenhum confronto gerado para esta posição.</p>';

        } catch (e) { console.error(e); }
    }

    window.onload = function() { renderCruzamento(); };
</script>
</body>
</html>
